<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>EL POLLO LOCO</title>
		<link rel="stylesheet" href="style.css" />

		<script src="models/drawable-object.class.js"></script>
		<script src="models/count-bar.class.js"></script>
		<script src="models/movable-object.class.js"></script>
		<script src="models/endboss.class.js"></script>
		<script src="models/bottle.class.js"></script>
		<script src="models/coin.class.js"></script>
		<script src="models/interval-hub.class.js"></script>
		<script src="models/image-hub.class.js"></script>
		<script src="models/throwable-object.class.js"></script>
		<script src="models/audio-hub.class.js"></script>
		<script src="models/statusbar-health.class.js"></script>
		<script src="models/character.class.js"></script>
		<script src="models/chicken-normal.class.js"></script>
		<script src="models/chicken-small.class.js"></script>
		<script src="models/cloud.class.js"></script>
		<script src="models/keyboard.class.js"></script>
		<script src="models/background-object.class.js"></script>
		<script src="models/level.class.js"></script>
		<script src="levels/level1.js"></script>
		<script src="models/world.class.js"></script>
		<script src="js/game.js"></script>
	</head>
	<body onload="init()">
		<header>
			<h1>El Pollo Loco</h1>
		</header>
		<main>
			<div id="canvasContainer">
				<div id="canvasWrapper">
					<canvas id="canvas" width="720" height="480"></canvas>

					<button id="muteBtn" onclick="toggleMute()">🔇</button>

					<section id="startScreen" class="overlay">
						<button onclick="startGame()">Start</button>
					</section>

					<section id="gameOver" class="overlay hidden">
						<button onclick="startGame()">Neustart</button>
						<button onclick="backToStart()">Startbildschirm</button>
					</section>

					<section id="winScreen" class="overlay hidden">
						<button onclick="startGame()">Neustart</button>
						<button onclick="backToStart()">Startbildschirm</button>
					</section>

					<section id="touchControls">
						<div class="touch-left">
							<button id="btnLeft" class="touch-btn">◀</button>
							<button id="btnRight" class="touch-btn">▶</button>
						</div>
						<div class="touch-right">
							<button id="btnJump" class="touch-btn">▲</button>
							<button id="btnThrow" class="touch-btn">✦</button>
						</div>
					</section>
				</div>
			</div>
		</main>
		<footer>
			<p class="copyright"></p>
			<p class="impressum"></p>
		</footer>
	</body>
</html>
